name: CI

on:
  # Build the main and ARM64 development branches.
  push:
    branches: ["github-ci-build-test", master, arm64]
  pull_request:
    branches: [master, arm64]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ARM64 currently runs under TCG on GitHub-hosted x86-64 runners and
          # can take more than an hour during first-boot compilation.
          - arch: arm64
            timeout: 90
            qemu_bin: qemu-system-aarch64
            qemu_machine: >-
              -machine virt
              -cpu max
              -kernel Lambda64/tools/kboot/kboot-generic-arm64.bin
              -device virtio-gpu-device
              -device virtio-keyboard-device
              -device virtio-mouse-device
              -drive if=none,file=lambda64.image,id=blk,format=raw
              -device virtio-blk-device,drive=blk
              -netdev user,id=vmnic,hostname=lambda64
              -device virtio-net-device,netdev=vmnic
              -semihosting-config enable=on,target=native
            qemu_exit_pass: 0
            qemu_exit_fail: 1

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout Lambda64
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: Lambda64          # -> $GITHUB_WORKSPACE/Lambda64

      # Resolve LBuild's current HEAD SHA (used as the cache key).
      - name: Get LBuild HEAD SHA
        id: lbuild-sha
        run: |
          echo "sha=$(git ls-remote https://github.com/tiwe0/LBuild refs/heads/arm64 | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore LBuild cache
        id: lbuild-cache
        uses: actions/cache@v5
        with:
          path: LBuild
          key: lbuild-${{ steps.lbuild-sha.outputs.sha }}
          # No restore-keys — a partial LBuild (wrong submodule state) is worse than none.

      - name: Checkout LBuild
        if: steps.lbuild-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: tiwe0/LBuild
          path: LBuild            # -> $GITHUB_WORKSPACE/LBuild
          ref: arm64

      # Cached LBuild might have some llf files cached.
      # TODO: Figure out how to do out-of-tree builds.
      - name: Clean LBuild
        working-directory: LBuild
        run: |
          rm -rf home/.cache/common-lisp/ home/.slime/ home/asdf/build/

      - name: Install apt packages
        run: |
          # forgejo does not have sudo installed by default, so
          # install it to unify builds
          if ! command -v sudo >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y --no-install-recommends sudo
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bzip2 \
            curl \
            qemu-system \
            git \
            lsof \
            sbcl

      - name: Install Quicklisp and dependencies
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local max_attempts="$1"
            shift
            local delay=5
            local attempt

            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              if "$@"; then
                return 0
              fi
              if ((attempt == max_attempts)); then
                echo "Command failed after ${max_attempts} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s: $*" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          install_quicklisp() {
            # A failed initial install can leave setup.lisp present with an
            # incomplete dist index. Start each retry from a clean directory.
            rm -rf "$HOME/quicklisp"
            curl --fail --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              https://beta.quicklisp.org/quicklisp.lisp \
              -o /tmp/quicklisp.lisp || return 1
            sbcl --non-interactive \
              --load /tmp/quicklisp.lisp \
              --eval '(quicklisp-quickstart:install :path (merge-pathnames "quicklisp/" (user-homedir-pathname)))' \
              --eval '(ql-util:without-prompting (ql:add-to-init-file))' || return 1
          }

          if [ ! -s ~/quicklisp/setup.lisp ] || [ ! -s ~/quicklisp/dists/quicklisp/systems.txt ]; then
            retry 3 install_quicklisp
          fi

          quickload_dependencies() {
            sbcl --non-interactive \
              --eval "(ql:quickload '(alexandria iterate nibbles cl-ppcre cl-fad closer-mop trivial-gray-streams) :silent t)" \
              --eval '(quit)'
          }

          retry 3 quickload_dependencies

      - name: Build cold image
        run: |
          set -o pipefail
          make -C LBuild \
            LAMBDA64_DIR=../Lambda64 \
            IMAGE=../lambda64.image \
            cold-image \
            2>&1 | tee "${{ github.workspace }}/build-cold-image.log"

      - name: Start file server
        run: |
          make -C LBuild LAMBDA64_DIR=../Lambda64 run-file-server \
            &> "${{ github.workspace }}/file-server.log" &
          echo $! > "${{ github.workspace }}/file-server.pid"
          # Wait for the server to become ready.
          timeout 30 bash -c 'until lsof -i :2599 -sTCP:LISTEN >/dev/null 2>&1; do sleep 1; done'
          echo "File server ready (PID $(cat ${{ github.workspace }}/file-server.pid))"

      - name: Run tests in QEMU
        shell: bash
        run: |
          set +e
          ${{ matrix.qemu_bin }} \
            -m 2G \
            -nographic \
            -monitor none \
            -serial stdio \
            -smp 4 \
            -no-reboot \
            ${{ matrix.qemu_machine }} \
          2>&1 | tee "${{ github.workspace }}/serial.log"
          QEMU_EXIT=${PIPESTATUS[0]}
          set -e
          case "${QEMU_EXIT}" in
            ${{ matrix.qemu_exit_pass }})
              ;;
            ${{ matrix.qemu_exit_fail }})
              exit 1
              ;;
            *)
              echo "Unexpected QEMU exit code ${QEMU_EXIT}"
              exit 1
              ;;
          esac

      - name: Stop file server
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/file-server.pid" ]; then
            kill "$(cat "${{ github.workspace }}/file-server.pid")" 2>/dev/null || true
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}-${{ matrix.arch }}
          path: |
            ${{ github.workspace }}/file-server.log
            ${{ github.workspace }}/serial.log
            ${{ github.workspace }}/build-cold-image.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload image on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lambda64-image-${{ github.run_id }}-${{ matrix.arch }}
          path: |
            ${{ github.workspace }}/lambda64.image
            ${{ github.workspace }}/lambda64.map
            ${{ github.workspace }}/lambda64.symbol-table
          retention-days: 3
